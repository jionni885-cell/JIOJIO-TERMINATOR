[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jiojio-terminator"
version = "0.1.0"
description = "Noyau d'orchestration, de verification et d'audit anti-erreur pour agents d'IA"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jionni885-cell" }]
keywords = ["ai-agents", "verification", "anti-hallucination", "consensus", "audit"]

# Le noyau ne depend de RIEN. Les extras sont optionnels.
dependencies = []

[project.optional-dependencies]
# `pyyaml` n'est pas la pour le noyau : il l'est pour les TESTS, qui doivent lire
# `.pre-commit-hooks.yaml` pour verifier ce que le depot declare aux projets qui
# l'utilisent. Mesure : sans lui, `python -m pytest -q` sur un clone neuf rend
# `ModuleNotFoundError: No module named 'yaml'` — deux tests rouges en CI.
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pyyaml>=6.0"]
http = ["httpx>=0.27"]
props = ["hypothesis>=6.100"]
verify = ["z3-solver>=4.13"]

[project.scripts]
jio = "jio.cli:main"

[tool.setuptools.packages.find]
include = ["jio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
