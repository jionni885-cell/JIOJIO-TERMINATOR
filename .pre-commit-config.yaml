# Configuration pre-commit du depot : controles code, documents et coherence globale.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        # Pyflakes et erreurs d'execution : le style reste hors blocage.
        args: ["--select", "E9,F"]
        files: ^(jio|tests|scripts)/

  - repo: local
    hooks:
      - id: jio-scan
        name: JIO — le projet s'audite lui-meme
        entry: python -m jio scan jio --exclude-tests --no-learn
        language: python
        additional_dependencies: ["pytest>=8.0", "pyyaml>=6.0", "httpx>=0.27", "hypothesis>=6.100", "z3-solver>=4.13"]
        pass_filenames: false
        always_run: true

      - id: jio-claims
        name: JIO — faits verifiables des documents
        entry: python -m jio claims --hook
        language: python
        additional_dependencies: ["pytest>=8.0", "pyyaml>=6.0", "httpx>=0.27", "hypothesis>=6.100", "z3-solver>=4.13"]
        files: '\.(md|markdown|rst|txt|org|adoc)$'
        exclude: ^evidence/

      - id: jio-coherence
        name: JIO — coherence d'ensemble (9 controles, un verdict)
        entry: python -m jio coherence
        language: python
        additional_dependencies: ["pytest>=8.0", "pyyaml>=6.0", "httpx>=0.27", "hypothesis>=6.100", "z3-solver>=4.13"]
        pass_filenames: false
        always_run: true
